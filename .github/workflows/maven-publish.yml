
name: Maven Package and Publish

on:
  push:
    branches:
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      # Checkout source code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Setup Java 21
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: github
          settings-path: ${{ github.workspace }}

      # Build and test Spring Boot application
      - name: Build with Maven
        run: mvn -B clean verify --file RentEaseLankaTeam/pom.xml
        env:
          DB_URL: ${{ vars.DB_URL }}
          DB_USERNAME: ${{ vars.DB_USERNAME }}
          DB_PASSWORD: ${{ vars.DB_PASSWORD }}
          JWT_SECRET: ${{ vars.JWT_SECRET }}

      # Publish to GitHub Packages
      - name: Publish to GitHub Packages
        run: mvn -B deploy --file RentEaseLankaTeam/pom.xml -s $GITHUB_WORKSPACE/settings.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
