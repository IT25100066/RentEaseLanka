# ── RentEaseLanka Nginx Site Config ──────────────────────────────────
# Deployed to: /etc/nginx/sites-available/renteaselanka
# Symlinked at: /etc/nginx/sites-enabled/renteaselanka
#
# Routing:
#   /      → React/Vite frontend  (localhost:5173)
#   /api   → Spring Boot backend  (localhost:8081)
#
# SSL is managed by Certbot (Let's Encrypt).
# Run:  sudo certbot --nginx -d yourdomain.com -d www.yourdomain.com
# ---------------------------------------------------------------------

# ── Redirect all HTTP to HTTPS ────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;

    server_name DOMAIN_PLACEHOLDER www.DOMAIN_PLACEHOLDER;

    # Allow Certbot ACME challenges through (used on first cert issuance)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS main server block ───────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name DOMAIN_PLACEHOLDER www.DOMAIN_PLACEHOLDER;

    # ── SSL — managed by Certbot ──────────────────────────────────────
    # Certbot will insert / replace these lines automatically.
    # ssl_certificate     /etc/letsencrypt/live/DOMAIN_PLACEHOLDER/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/DOMAIN_PLACEHOLDER/privkey.pem;
    # include             /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Security headers ──────────────────────────────────────────────
    add_header X-Frame-Options       "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"     always;
    add_header Referrer-Policy       "strict-origin-when-cross-origin" always;

    # ── Gzip compression ──────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # ─────────────────────────────────────────────────────────────────
    # 1. Backend API  →  /api/*  (Spring Boot on port 8081)
    # ─────────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://localhost:8081/api/;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # Disable buffering for streaming/SSE endpoints
        proxy_buffering off;
    }

    # ─────────────────────────────────────────────────────────────────
    # 2. Frontend  →  /  (React/Vite on port 5173)
    # ─────────────────────────────────────────────────────────────────
    location / {
        proxy_pass         http://localhost:5173/;
        proxy_http_version 1.1;

        # WebSocket support (required for Vite HMR)
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}
