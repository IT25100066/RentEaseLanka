spring.application.name=RentEaseLankaTeam

# Integrated Security JDBC Connection String
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=RentEaseLanka;encrypt=true;trustServerCertificate=true;
spring.datasource.username=root
spring.datasource.password=1234

# JPA / Hibernate Configurations
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect