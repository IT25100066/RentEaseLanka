spring.application.name=RentEaseLankaTeam

# Integrated Security JDBC Connection String
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=RentEaseLanka;encrypt=true;trustServerCertificate=true;
spring.datasource.username=root
spring.datasource.password=1234

spring.data.redis.port=6379

# JPA / Hibernate Configurations
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# File Upload Limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB