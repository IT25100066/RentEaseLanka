<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Vehicle Category Create API Tester</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 16px; background: #f5f5f5; }
  h1 { font-size: 20px; }
  form { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
  label { display: block; margin-top: 12px; font-weight: bold; font-size: 14px; }
  input, textarea { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-family: inherit; }
  textarea { resize: vertical; min-height: 60px; }
  button { margin-top: 20px; padding: 10px 20px; background: #2563eb; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
  button:hover { background: #1d4ed8; }
  pre { background: #111; color: #0f0; padding: 12px; border-radius: 6px; overflow-x: auto; white-space: pre-wrap; word-break: break-word; }
  .status { margin-top: 16px; font-weight: bold; }
  .ok { color: green; }
  .err { color: red; }
</style>
</head>
<body>

<h1>Vehicle Category Create API Tester</h1>

<form id="categoryForm">
  <label for="apiUrl">API Endpoint</label>
  <input type="text" id="apiUrl" value="http://localhost:8080/api/category/create" required>

  <label for="name">Name *</label>
  <input type="text" id="name" placeholder="e.g. SUV" required>

  <label for="description">Description</label>
  <textarea id="description" placeholder="e.g. Spacious vehicles suited for families and long trips"></textarea>

  <label for="basePrice">Base Price *</label>
  <input type="number" id="basePrice" step="0.01" min="0" placeholder="e.g. 5000.00" required>

  <button type="submit">Send POST Request</button>
</form>

<div class="status" id="status"></div>
<pre id="output">Response will appear here...</pre>

<script>
document.getElementById('categoryForm').addEventListener('submit', async function (e) {
  e.preventDefault();

  const url = document.getElementById('apiUrl').value.trim();
  const statusEl = document.getElementById('status');
  const outputEl = document.getElementById('output');

  const payload = {
    name: document.getElementById('name').value,
    description: document.getElementById('description').value,
    basePrice: parseFloat(document.getElementById('basePrice').value)
  };

  statusEl.textContent = 'Sending...';
  statusEl.className = 'status';
  outputEl.textContent = '';

  try {
    const response = await fetch(url, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(payload)
    });

    const contentType = response.headers.get('content-type') || '';
    let bodyText;
    if (contentType.includes('application/json')) {
      const json = await response.json();
      bodyText = JSON.stringify(json, null, 2);
    } else {
      bodyText = await response.text();
    }

    if (response.ok) {
      statusEl.textContent = `Success — HTTP ${response.status}`;
      statusEl.className = 'status ok';
    } else {
      statusEl.textContent = `Failed — HTTP ${response.status}`;
      statusEl.className = 'status err';
    }

    outputEl.textContent = bodyText;

  } catch (err) {
    statusEl.textContent = 'Request error';
    statusEl.className = 'status err';
    outputEl.textContent = err.message + '\n\nNote: if this is a CORS error, your Spring Boot API needs CORS configuration enabled for this origin.';
  }
});
</script>

</body>
</html>
