<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Vehicle Create API Tester</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 16px; background: #f5f5f5; }
  h1 { font-size: 20px; }
  form { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
  label { display: block; margin-top: 12px; font-weight: bold; font-size: 14px; }
  input { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
  button { margin-top: 20px; padding: 10px 20px; background: #2563eb; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
  button:hover { background: #1d4ed8; }
  pre { background: #111; color: #0f0; padding: 12px; border-radius: 6px; overflow-x: auto; white-space: pre-wrap; word-break: break-word; }
  .status { margin-top: 16px; font-weight: bold; }
  .ok { color: green; }
  .err { color: red; }
</style>
</head>
<body>

<h1>Vehicle Create API Tester</h1>

<form id="vehicleForm">
  <label for="apiUrl">API Endpoint</label>
  <input type="text" id="apiUrl" value="http://localhost:8080/api/vehicle/create" required>

  <label for="licensePlate">License Plate *</label>
  <input type="text" id="licensePlate" placeholder="e.g. ABC-1234" required>

  <label for="model">Model *</label>
  <input type="text" id="model" placeholder="e.g. Toyota Corolla" required>

  <label for="dailyRate">Daily Rate *</label>
  <input type="number" id="dailyRate" step="0.01" min="0.01" placeholder="e.g. 45.50" required>

  <label for="year">Year</label>
  <input type="number" id="year" placeholder="e.g. 2022">

  <label for="categoryId">Category ID *</label>
  <input type="number" id="categoryId" placeholder="e.g. 1" required>

  <label for="images">Images</label>
  <input type="file" id="images" multiple accept="image/*">

  <button type="submit">Send POST Request</button>
</form>

<div class="status" id="status"></div>
<pre id="output">Response will appear here...</pre>

<script>
document.getElementById('vehicleForm').addEventListener('submit', async function (e) {
  e.preventDefault();

  const url = document.getElementById('apiUrl').value.trim();
  const statusEl = document.getElementById('status');
  const outputEl = document.getElementById('output');

  const formData = new FormData();
  formData.append('licensePlate', document.getElementById('licensePlate').value);
  formData.append('model', document.getElementById('model').value);
  formData.append('dailyRate', document.getElementById('dailyRate').value);
  formData.append('Year', document.getElementById('year').value || 0);
  formData.append('categoryId', document.getElementById('categoryId').value);

  const files = document.getElementById('images').files;
  for (let i = 0; i < files.length; i++) {
    formData.append('images', files[i]);
  }

  statusEl.textContent = 'Sending...';
  statusEl.className = 'status';
  outputEl.textContent = '';

  try {
    const response = await fetch(url, {
      method: 'POST',
      body: formData
      // Do NOT set Content-Type manually — the browser sets the correct
      // multipart/form-data boundary automatically when using FormData.
    });

    const contentType = response.headers.get('content-type') || '';
    let bodyText;
    if (contentType.includes('application/json')) {
      const json = await response.json();
      bodyText = JSON.stringify(json, null, 2);
    } else {
      bodyText = await response.text();
    }

    if (response.ok) {
      statusEl.textContent = `Success — HTTP ${response.status}`;
      statusEl.className = 'status ok';
    } else {
      statusEl.textContent = `Failed — HTTP ${response.status}`;
      statusEl.className = 'status err';
    }

    outputEl.textContent = bodyText;

  } catch (err) {
    statusEl.textContent = 'Request error';
    statusEl.className = 'status err';
    outputEl.textContent = err.message + '\n\nNote: if this is a CORS error, your Spring Boot API needs @CrossOrigin enabled, or you need to serve this page from an allowed origin.';
  }
});
</script>

</body>
</html>
