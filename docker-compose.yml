services:
  # 1. Microsoft SQL Server Database
  mssql-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mssql-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql

  redis-cache:
    image: redis:7-alpine
    container_name: redis-cache
    ports:
      - "6379:6379"

  # 2. Spring Boot Backend
  backend:
    build:
      context: ./RentEaseLankaTeam
      dockerfile: Dockerfile
      tags:
        - it25100066/renteaselanka-backend:latest
    container_name: RentEaseLanka-Backend
    ports:
      - "8081:8081"
    depends_on:
      - mssql-db
    volumes:
      - ./RentEaseLankaTeam/uploads:/app/uploads
      - ./RentEaseLankaTeam/src:/app/src
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_URL=${DB_URL}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - SERVER_PORT=${SERVER_PORT}
      - REDIS_SERVER_NAME=${REDIS_SERVER_NAME}
      - REDIS_SERVER_PORT=${REDIS_SERVER_PORT}

  # 3. Vite React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: Rent-Ease-Lanka-Frontend
    ports:
      - "5173:5173" # Exposing port 5173 for the Vite development server
    depends_on:
      - backend

volumes:
  mssql-data:
